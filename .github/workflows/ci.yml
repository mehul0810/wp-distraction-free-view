name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - master
      - main

jobs:
  test:
    name: PHP and asset checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Validate Composer
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHP coding standards
        run: composer lint

      - name: PHPUnit
        run: composer test

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: JavaScript lint
        run: npm run lint:js

      - name: CSS lint
        run: npm run lint:css

      - name: Build assets
        run: npm run build

  integration-tests:
    name: WordPress integration tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Use WordPress-compatible PHPUnit
        run: composer require --dev phpunit/phpunit:^9.6 --with-all-dependencies --no-progress

      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest true

      - name: PHPUnit integration tests
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: composer test:integration

      - name: PHPUnit integration tests with multisite
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_MULTISITE: 1
        run: composer test:integration

  production-package:
    name: Production package and Plugin Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Validate Composer
        run: composer validate --strict

      - name: Install production Composer dependencies
        run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Build production package
        run: |
          mkdir -p build
          rsync -rc --exclude-from="$GITHUB_WORKSPACE/.distignore" "$GITHUB_WORKSPACE/" build/wp-distraction-free-view/ --delete --delete-excluded
          cd build
          zip -r "$GITHUB_WORKSPACE/wp-distraction-free-view.zip" wp-distraction-free-view

      - name: Validate production package shape
        run: bash .github/scripts/check-production-package.sh build/wp-distraction-free-view

      - name: Run Plugin Check against production package
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build/wp-distraction-free-view'
          slug: wp-distraction-free-view
